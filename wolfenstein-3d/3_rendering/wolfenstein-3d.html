<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wolfenstein 3D</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        #viewport {
            width: 1280px;
            /* display size */
            height: 720px;
            image-rendering: pixelated;
        }
    </style>
</head>

<body>
    <h1>Wolfenstein 3D</h1>
    <div> <canvas id="viewport"></canvas></div>
    <script>
        "use strict";
        /**
         * Buffer Index
         * @param {number} x
         * @param {number} y
         * @param {number} w
         * @return {number}
         */
        const bi = (x, y, w) => y * w + x;
        /**
         * Buffer Index - Bounds Checked
         * @param {number} x
         * @param {number} y
         * @param {number} w
         * @param {number} h
         * @return {number | undefined}
         */
        const bi_s = (x, y, w, h) => {
            if (x >= w || y >= h || x < 0 || y < 0) {
                // console.error("Out of bounds.")
                return undefined
            }
            return bi(x, y, w)
        }

        /**
         * @param {number} w
         * @param {number} h
         * @return {Array}
         */
        const create_rect_buffer = (w, h) => new Array(w * h);

        const _DEFAULT_VIEWPORT_W = 400;
        const _DEFAULT_VIEWPORT_H = 300;
        const setup_viewport = () => {
            const canvas = document.getElementById("viewport");
            const ctx = canvas.getContext("2d");

            let viewport_w = _DEFAULT_VIEWPORT_W;
            const get_viewport_w = () => viewport_w;
            let viewport_h = _DEFAULT_VIEWPORT_H;
            const get_viewport_h = () => viewport_h;

            let imageData;
            let framebuffer;
            /**
             * @param {number} w
             * @param {number} h
             * @return {void}
             */
            const set_resolution = (w, h) => {
                viewport_w = w;
                viewport_h = h;

                canvas.width = viewport_w;
                canvas.height = viewport_h;

                imageData = ctx.createImageData(viewport_w, viewport_h);
                framebuffer = imageData.data;
            };

            /**
             * @param {number} x
             * @param {number} y
             * @param {number} r
             * @param {number} g
             * @param {number} b
             * @param {number} a
             * @return {void}
            */
            const set_pixel = (x, y, r, g, b, a = 255) => {
                const i = (((viewport_h - 1) - y) * viewport_w + x) * 4;
                framebuffer[i] = r;
                framebuffer[i + 1] = g;
                framebuffer[i + 2] = b;
                framebuffer[i + 3] = a;
            };
            /**
             * @return {void}
             */
            const clear = () => framebuffer.fill(0);

            /**
             * @return {void}
             */
            const render = () => ctx.putImageData(imageData, 0, 0);

            // probs better way/place to do this
            canvas.addEventListener('click', () => { canvas.requestPointerLock(); });

            return {
                get_viewport_w,
                get_viewport_h,
                set_resolution,

                set_pixel,
                clear,
                render,
            };
        }

        /**
         * @param {string} str
         */
        const load_tilemap = (str, scale) => {

            const rows = str.split("\n").map(row => row.trim()).filter(row => row.length > 0);

            const w = rows[0].length;
            const h = rows.length;

            const tilemap = create_rect_buffer(w, h);
            let i = 0;

            for (let y = 0; y < h; ++y) {
                const ty = h - 1 - y;
                if (w != rows[ty].length) {
                    console.error("Tilemap is of irregular size, must be a rectangle.")
                    return null;
                }

                for (let x = 0; x < w; ++x) {
                    const tx = x;
                    tilemap[i] = rows[ty][tx]
                    ++i;
                }
            }

            if (i != w * h) {
                console.error("Tilemap is of irregular size.")
                return null
            }
            return {
                buffer: tilemap,
                w: w,
                h: h,
                grid_scale: 10
            }
        }

        const tilemap = load_tilemap(`
                                    ###########
                                    #   #     #
                                    #   #  #  #
                                    ## ##     #
                                    #         #
                                    #     #####
                                    #         #
                                    # #       #
                                    # ###     #
                                    #      S  #
                                    ###########
                                    `)

        const player = {
            pos_x: 0,
            pos_y: 0,

            rot: 0,

            move_speed: 25
        }
        const move = (player, axis_fwd, axis_strafe, delta) => {
            /**
             *     -strafe
             *       |
             *     --@----- > +forwards
             *       |
             *       v
             *     +strafe
             */
            if ((axis_fwd != 0 || axis_strafe != 0)) {
                const length = Math.sqrt(axis_fwd * axis_fwd + axis_strafe * axis_strafe);
                const local_x = axis_fwd / length;
                const local_y = axis_strafe / length;

                const looking_x = Math.cos(player.rot);
                const looking_y = Math.sin(player.rot);

                const move_x = local_x * looking_x + local_y * looking_y;
                const move_y = local_x * looking_y - local_y * looking_x;
                const velocity = player.move_speed * delta;
                player.pos_x += move_x * velocity;
                player.pos_y += move_y * velocity;
            }
        }

        /**
         * DDA (https://en.wikipedia.org/wiki/Digital_differential_analyzer_(graphics_algorithm))
         *
         * @param {number} x0
         * @param {number} y0
         * @param {number} x1
         * @param {number} y1
         *
         * @param {number} r
         * @param {number} g
         * @param {number} b
         * @param {number} a
         *
         * @return {void}
         */
        const draw_line = (x0, y0, x1, y1, r, g, b, a = 255) => {
            // find m = dy/dx
            const dx = x1 - x0;
            const dy = y1 - y0;

            // use the more "aggressive" axis (longer) as the step
            const longest_axis_mangnitude = (Math.abs(dx) >= Math.abs(dy)) ? Math.abs(dx) : Math.abs(dy)
            // the move along "step axis" by 1 pixel while moving along the other axis by the slope
            const step_x = dx / longest_axis_mangnitude;
            const step_y = dy / longest_axis_mangnitude;
            let x = x0;
            let y = y0;

            // since we only move 1 pixel in the longest magnitude axis(see above), we can iterate on it per pixel
            for (
                let i = 0; i <= longest_axis_mangnitude; ++i) {
                // paint along the steps
                viewport.set_pixel(Math.round(x), Math.round(y), // ensure that it is the pixel position not a float
                    r, g, b, a
                );

                // move to next step
                x += step_x;
                y += step_y;
            }
        }

        /**
         * @param {number} x0
         * @param {number} y0
         * @param {number} x1
         * @param {number} y1
         *
         * @param {number} r
         * @param {number} g
         * @param {number} b
         * @param {number} a
         *
         * @return {void}
         */
        const draw_rect = (x0, y0, x1, y1, r, g, b, a = 255) => {
            for (let py = y0; py < y1; ++py) {
                for (let px = x0; px < x1; ++px) {
                    viewport.set_pixel(px, py, r, g, b, a)
                }
            }
        }

        /**
         * @param {number} x0
         * @param {number} y0
         * @param {number} x1
         * @param {number} y1
         *
         * @param {number} r
         * @param {number} g
         * @param {number} b
         * @param {number} a
         *
         * @return {void}
         */
        const draw_rect_hollow = (x0, y0, x1, y1, r, g, b, a = 255) => {
            // Left + Right edge
            for (let py = y0; py < y1; ++py) {
                viewport.set_pixel(x0, py, r, g, b, a)
                viewport.set_pixel(x1, py, r, g, b, a)
            }

            // Top + Bottom edge
            for (let px = x0; px < x1; ++px) {
                viewport.set_pixel(px, y0, r, g, b, a)
                viewport.set_pixel(px, y1, r, g, b, a)
            }
        }

        /**
         * @param {number} x0
         * @param {number} y0
         * @param {number} x1
         * @param {number} y1
         */
        const dist_sq = (x0, y0, x1, y1) => ((x0 - x1) * (x0 - x1)) + ((y0 - y1) * (y0 - y1))
        /**
         * @param {number} cx
         * @param {number} cy
         * @param {number} cr
         *
         * @param {number} r
         * @param {number} g
         * @param {number} b
         * @param {number} a
         *
         * @return {void}
         */
        const draw_circle = (cx, cy, cr, r, g, b, a = 255) => {
            const cr_sq = cr * cr;

            // within an AABB do a brute force circle check
            for (let py = cy - cr; py < cy + cr; ++py) {
                for (let px = cx - cr; px < cx + cr; ++px) {
                    if (dist_sq(px, py, cx, cy) - cr_sq <= 0) {
                        viewport.set_pixel(px, py, r, g, b, a)
                    }
                }
            }
        }

        const draw_minimap = (delta, viewport, width, height, padding, zoom) => {
            // assume it is always aligned to the bottom right (can make this a proper thing later)
            const x1 = viewport.get_viewport_w() - padding
            const x0 = x1 - width;
            const y0 = padding;
            const y1 = y0 + height;

            draw_rect(x0, y0, x1, y1, 10, 10, 10, 255) // BG

            // foreach pixel within the "frame"
            for (let fpy = 0; fpy < height; ++fpy) {
                for (let fpx = 0; fpx < width; ++fpx) {
                    // frame pixel -> centered on zero
                    const px = fpx - width / 2;
                    const py = fpy - height / 2;

                    // Map pixel to world pos (and offset to center on player)
                    const x = player.pos_x + (px / zoom); // zoom can also be thought of as making the tiles bigger relatively speaking
                    const y = player.pos_y + (py / zoom);

                    // world pos -> tile pos -> tile index (floor)
                    const ix = Math.floor(x / tilemap.grid_scale);
                    const iy = Math.floor(y / tilemap.grid_scale);

                    // lookup correct tile and render
                    const bi = bi_s(ix, iy, tilemap.w, tilemap.h);
                    if (bi == undefined) { continue };
                    if (tilemap.buffer[bi] === '#') {
                        viewport.set_pixel(x0 + fpx, y0 + fpy, 200, 200, 200);
                    }
                }
            }

            draw_rect_hollow(x0, y0, x1, y1, 255, 255, 255) // Outline

            // draw player (always center)
            draw_circle(x0 + width / 2, y0 + height / 2, 5, 0, 255, 0)
        }


        const DEG2RAD = Math.PI / 180;
        const FOV_DEFAULT_DEG = 90 // source-like default
        let fov = FOV_DEFAULT_DEG * DEG2RAD;

        /**
         * @param{Tilemap} tilemap
         * @param{number} ox       
         * @param{number} oy      
         * @param{number} dx
         * @param{number} dy
         * @param{number} max_dist
         */
        const raycast_dda = (tilemap, ox, oy, dx, dy, max_dist) => {
            // Scale positions to tilemap coords
            ox /= tilemap.grid_scale;
            oy /= tilemap.grid_scale;
            dx /= tilemap.grid_scale;
            dy /= tilemap.grid_scale;
            max_dist /= tilemap.grid_scale;

            // Cell positions are always ints
            let cx = Math.floor(ox);
            let cy = Math.floor(oy);

            // Diagonal distance from the edges of x to x+1 (or y to y+1)
            const diag_dist_x = Math.abs(1 / dx);
            const diag_dist_y = Math.abs(1 / dy);

            // Distance to nearest edge along said axis
            let edge_dist_x;
            let edge_dist_y;

            // Direction to step in
            let step_x;
            let step_y;

            // Calculate initial step (to a cell edge)
            if (dx < 0) {
                step_x = -1;
                edge_dist_x = (ox - cx) * diag_dist_x;
            } else {
                step_x = 1;
                edge_dist_x = (cx + 1.0 - ox) * diag_dist_x;
            }

            if (dy < 0) {
                step_y = -1;
                edge_dist_y = (oy - cy) * diag_dist_y;
            } else {
                step_y = 1;
                edge_dist_y = (cy + 1.0 - oy) * diag_dist_y;
            }

            let side = 0;
            let perp_dist = 0;

            // DDA loop
            while (perp_dist <= max_dist) {
                // Choose the axis to "snap" to which requires moving along the diagonal the least
                if (edge_dist_x < edge_dist_y) {
                    perp_dist = edge_dist_x;
                    edge_dist_x += diag_dist_x;
                    cx += step_x;
                    side = 0;
                } else {
                    perp_dist = edge_dist_y;
                    edge_dist_y += diag_dist_y;
                    cy += step_y;
                    side = 1;
                }

                const bi = bi_s(cx, cy, tilemap.w, tilemap.h);
                if (bi == undefined) {
                    return null;
                }

                const cell = tilemap.buffer[bi];
                if (cell == '#') {
                    return {
                        side: side,
                        cell: cell,
                        cell_pos_x: cx,
                        cell_pos_y: cy,
                        perp_dist: perp_dist,
                    };
                }
            }
            return null;
        };

        const render_scene = (delta, viewport, max_render_dist) => {
            const w = viewport.get_viewport_w();
            const h = viewport.get_viewport_h();

            // Camera / player look direction  
            const look_dir_x = Math.cos(player.rot);
            const look_dir_y = Math.sin(player.rot);

            // The camera plane (a line in 2D) defined by a 2D vector
            //                      
            //                         plane width
            //                     +-----------------+ 
            //                     ___________________ 
            //                  +  \        |        /
            //                  |   \       |       /
            //                  |    \      |      /
            //                  |     \     |     /
            //   plane distance |      \    |    /
            //                  |       \   |   /
            //                  |        \  |  /   
            //                  |         \ | / \___ FoV   
            //                  |          \|/
            //                  +           v
            //                              @
            //                            
            //

            // Scaling the camera plane based on the fov (a ratio between the distance of the plane and the (half-)width)
            const fov_proportion = Math.tan(fov / 2)

            // The camera plane (x+ is the "forward" of the camera at rotation = 0)
            //
            //     y+
            //     ^            
            //     |          /
            //     +--> x+   / 
            //              /  
            //             /   
            //            /    
            //           @----->  look dir            + 
            //            \                           | camera plane
            //             \                          |
            //              \                         v
            //               \ 
            //                \
            //                 
            // Convert the camera plane from local space to world space
            const cam_plane_x = -look_dir_y * fov_proportion;
            const cam_plane_y = look_dir_x * fov_proportion;

            // Cache the calculation of the wall height scaling
            const wall_scale_factor = (h * tilemap.grid_scale) / fov_proportion;

            // Foreach vertical pixel
            for (let px = 0; px < w; ++px) {
                // Map the pixel to the offset from the center of the plane
                const offset_along_plane = 1 - (2 * px / w);
                // Take the raycast direction
                const dx = look_dir_x + cam_plane_x * offset_along_plane;
                const dy = look_dir_y + cam_plane_y * offset_along_plane;

                const hit = raycast_dda(tilemap, player.pos_x, player.pos_y, dx, dy, max_render_dist);
                if (hit != null) {
                    // Height of the hit wall
                    const line_height = Math.floor(wall_scale_factor / hit.perp_dist);

                    let py_wall_bottom = (h - line_height) / 2;
                    let py_wall_top = (h + line_height) / 2;

                    const shade = 1 - Math.sqrt(hit.perp_dist / max_render_dist);
                    const color = 220 * shade * (hit.side === 1 ? 0.6 : 1);

                    // Draw
                    for (let py = 0; py < h; ++py) {
                        if (py < py_wall_bottom) {
                            // Floor
                            viewport.set_pixel(px, py, 39, 45, 45);
                        } else if (py_wall_top < py) {
                            // Celing / Sky
                            viewport.set_pixel(px, py, 25, 40, 100);
                        } else {
                            // Wall
                            viewport.set_pixel(px, py, color, color, color);
                        }
                    }
                } else {
                    // ERROR - failed to hit tile
                    for (let py = 0; py < h; ++py) {
                        viewport.set_pixel(px, py, 255, 0, 255);
                    }
                }
            }
        };
        const draw = (delta, viewport) => {
            render_scene(delta, viewport, 1500)

            draw_minimap(delta, viewport, 300, 250, 5, 2);
        };

        const tick_rate = 60;
        const render_fps = null;

        let physics_last_frame = performance.now();
        let render_last_frame = performance.now();
        let physics_delta = 0;
        let render_delta = 0;

        let sens = 0.35;
        let axis_forwards = 0;
        let axis_strafe = 0;

        const tick = (delta) => {
            //strafe
            axis_strafe = 0
            if (input.keys.a) { axis_strafe += -1; }
            if (input.keys.d) { axis_strafe += 1; }
            //forwards
            axis_forwards = 0
            if (input.keys.s) { axis_forwards += -1; }
            if (input.keys.w) { axis_forwards += 1; }
            //look
            if (input.mouse.dx) {
                player.rot += sens * -input.mouse.dx * delta; // -ve = non-inverted mouse
                input.mouse.dx = 0; // consume the delta after reading otherwise it will continue with no input
            }

            move(player, axis_forwards, axis_strafe, delta)
        }

        const viewport = setup_viewport();
        viewport.set_resolution(1280, 720);

        const input = {
            keys: {},
            mouse: {
                dx: 0, dy: 0,
                buttons: {}
            }
        };

        // Keyboard
        ["keydown", "keyup"].forEach(type => {
            window.addEventListener(type, e => {
                input.keys[e.key] = type === "keydown";
            });
        });

        // Mouse
        ["mousedown", "mouseup"].forEach(type => {
            window.addEventListener(type, e => {
                input.mouse.buttons[e.button] = type === "mousedown";
            });
        });

        window.addEventListener("mousemove", e => {
            input.mouse.dx = e.movementX;
            input.mouse.dy = e.movementY;
        });

        const update = () => {
            const current_frame = performance.now();

            physics_delta = (current_frame - physics_last_frame) / 1000;
            if (tick_rate == null || physics_delta >= 1 / tick_rate) {
                tick(physics_delta);
                physics_last_frame = current_frame;
            }

            render_delta = (current_frame - render_last_frame) / 1000;
            if (render_fps == null || render_delta >= 1 / render_fps) {
                viewport.clear();
                draw(render_delta, viewport);
                viewport.render();
                render_last_frame = current_frame;
            }

            requestAnimationFrame(() => update());
        };

        player.pos_x = 5 * tilemap.w;
        player.pos_y = 5 * tilemap.h;

        requestAnimationFrame(() => update());
    </script>
</body>

</html>
