<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wolfenstein 3D</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .box {
            display: flex;
            gap: 0;
            margin: 0;
        }

        .center {
            align-items: center;
            justify-content: center;
        }

        .hori {
            flex-direction: row;
        }

        .vert {
            flex-direction: column;
        }

        .viewport {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            image-rendering: pixelated;
            display: block;
        }

        #controls {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #controls>.box {
            width: 100%;
            justify-content: space-around;
            gap: 25px;
        }

        #controls button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            font-size: 24px;
            background: #1a1a1a;
            color: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #0a0a0a;
            transition: all 0.05s ease;
        }

        #controls button:active {
            background: #2a2a2a;
            box-shadow: 0 1px #0a0a0a;
            transform: translateY(3px);
        }

        .vert>button {
            border-bottom: none;
            border-radius: 8px 8px 0 0;
        }

        .hori button {
            border-radius: 0;
        }

        .hori button:first-child {
            border-radius: 0 0 0 8px;
        }

        .hori button:last-child {
            border-radius: 0 0 8px 0;
        }
    </style>
</head>

<body class="box center vert">
    <h1>Wolfenstein 3D</h1>
    <canvas id="viewport" class="viewport"></canvas>

    <form autocomplete="off">
        <label for="res-select">Select Res:</label>
        <select id="res-select" required>
            <optgroup label="Original Resolution (16:10)">
                <option value="0">320x200</option>
            </optgroup>
            <optgroup label="Square (4:3)">
                <option value="1">320x240</option>
                <option value="2">640x480</option>
                <option value="3">900x720</option>
                <option value="4">1350x1080 (5:4)</option>
            </optgroup>
            <optgroup label="Widescreen (16:9)">
                <option value="5">432x240</option>
                <option value="6">854x480</option>
                <option value="7" selected>1280x720</option>
                <option value="8">1920x1080</option>
            </optgroup>
        </select>

        <label for="fov-slider">FoV (Degrees): </label>
        <input type="range" id="fov" value="90" min="45" max="120" step="15">
    </form>

    <div id="controls">
        <div class="box center">
            <div class="box center vert">
                <button id="virtual-dpad-forward">⬆️</button>
                <div class="box center hori">
                    <button id="virtual-dpad-left">⬅️</button>
                    <button id="virtual-dpad-backward">⬇️</button>
                    <button id="virtual-dpad-right">➡️</button>
                </div>
            </div>
            <button id="virtual-look-left">↪️</button>
            <button id="virtual-look-right">↩️</button>
        </div>
    </div>
    <script>
        /// MARK: HEADER
        //#region Santity Preserving Types
        "use strict";

        // BASIC NUMBER TYPES
        /**
         * @typedef {number & { __int__: true }} int
         */

        /**
        * @typedef {number & { __int__: true, __range__: "0-255" }} byte
        */

        /**
         * @typedef {number & { __float__: true }} float
         */

        //#endregion
        //#region Struct Types
        /**
         * @typedef {object} Texture
         * @property {Uint8ClampedArray} buffer
         * @property {int} w          
         * @property {int} h         
         */
        //#endregion
        //#region Utils
        const clamp01 = (x) => Math.min(Math.max(x, 1), 0)
        /**
         * Buffer Index
         * @param {int} x
         * @param {int} y
         * @param {int} w
         * @return {int}
         */
        const bi = (x, y, w) => y * w + x;
        /**
         * Buffer Index - Bounds Checked
         * @param {int} x
         * @param {int} y
         * @param {int} w
         * @param {int} h
         * @return {int | undefined}
         */
        const bi_s = (x, y, w, h) => {
            if (x >= w || y >= h || x < 0 || y < 0) {
                // console.error("Out of bounds.")
                return undefined
            }
            return bi(x, y, w)
        }

        /**
         * @param {int} w
         * @param {int} h
         * @return {Array}
         */
        const create_rect_buffer = (w, h) => new Array(w * h);
        //#endregion

        /// MARK: PROGRAM START
        (async () => {

            const _DEFAULT_VIEWPORT_W = 1280;
            const _DEFAULT_VIEWPORT_H = 720;

            const DEG2RAD = Math.PI / 180;
            const FOV_DEFAULT_DEG = 90 // source-like default
            let fov = FOV_DEFAULT_DEG * DEG2RAD;

            /**
             * @return {Viewport}
             */
            const setup_viewport = () => {
                const canvas = document.getElementById("viewport");
                const ctx = canvas.getContext("2d");

                let viewport_w = _DEFAULT_VIEWPORT_W;
                /**
                 * @return {int}
                 */
                const get_viewport_w = () => viewport_w;
                let viewport_h = _DEFAULT_VIEWPORT_H;
                /**
                 * @return {int}
                 */
                const get_viewport_h = () => viewport_h;

                let imageData;
                let framebuffer;
                /**
                 * @param {int} w
                 * @param {int} h
                 * @return {void}
                 */
                const set_resolution = (w, h) => {
                    viewport_w = w;
                    viewport_h = h;

                    canvas.width = viewport_w;
                    canvas.height = viewport_h;

                    imageData = ctx.createImageData(viewport_w, viewport_h);
                    framebuffer = imageData.data;
                };

                /**
                 * @param {int} x
                 * @param {int} y
                 * @param {byte} r
                 * @param {byte} g
                 * @param {byte} b
                 * @param {byte} a
                 * @return {void}
                */
                const set_pixel = (x, y, r, g, b, a = 255) => {
                    const i = (((viewport_h - 1) - y) * viewport_w + x) * 4;
                    framebuffer[i] = r;
                    framebuffer[i + 1] = g;
                    framebuffer[i + 2] = b;
                    framebuffer[i + 3] = a;
                };
                /**
                 * @return {void}
                 */
                const clear = () => framebuffer.fill(0);

                /**
                 * @return {void}
                 */
                const render = () => ctx.putImageData(imageData, 0, 0);

                // probs better way/place to do this
                canvas.addEventListener('click', () => { canvas.requestPointerLock(); });

                const resolutions = {
                    "0": { w: 320, h: 200, aspect: "16 / 10" },
                    "1": { w: 320, h: 240, aspect: "4 / 3" },
                    "2": { w: 640, h: 480, aspect: "4 / 3" },
                    "3": { w: 900, h: 720, aspect: "4 / 3" },
                    "4": { w: 1350, h: 1080, aspect: "5 / 4" },
                    "5": { w: 432, h: 240, aspect: "16 / 9" },
                    "6": { w: 854, h: 480, aspect: "16 / 9" },
                    "7": { w: 1280, h: 720, aspect: "16 / 9" },
                    "8": { w: 1920, h: 1080, aspect: "16 / 9" }
                };

                const res_selector = document.getElementById("res-select");
                res_selector.addEventListener("change", (e) => {
                    const selected = resolutions[e.target.value];

                    if (selected) {
                        set_resolution(selected.w, selected.h);
                        canvas.style.aspectRatio = selected.aspect;
                        console.log(`Resolution updated to: ${selected.w}x${selected.h} (${selected.aspect})`);
                    }
                    else {
                        console.error("Bad resolution.")
                    }
                });

                const fov_slider = document.getElementById("fov");
                fov_slider.addEventListener("input", (e) => {
                    fov = parseFloat(e.target.value * DEG2RAD);
                })

                return {
                    get_viewport_w,
                    get_viewport_h,
                    set_resolution,

                    set_pixel,
                    clear,
                    render,
                };
            }

            /**
             * @param {string} str
             * @param {float} scale
             */
            const load_tilemap = (str, scale) => {

                const rows = str.split("\n").map(row => row.trim()).filter(row => row.length > 0);

                const w = rows[0].length;
                const h = rows.length;

                const tilemap = create_rect_buffer(w, h);
                let i = 0;

                for (let y = 0; y < h; ++y) {
                    const ty = h - 1 - y;
                    if (w != rows[ty].length) {
                        console.error("Tilemap is of irregular size, must be a rectangle.")
                        return null;
                    }

                    for (let x = 0; x < w; ++x) {
                        const tx = x;
                        tilemap[i] = rows[ty][tx]
                        ++i;
                    }
                }

                if (i != w * h) {
                    console.error("Tilemap is of irregular size.")
                    return null
                }
                return {
                    buffer: tilemap,
                    w: w,
                    h: h,
                    grid_scale: 10
                }
            }

            const tilemap = load_tilemap(`
#######################################################
#   %             ###     ####     ###              ###
#          %              ####                #     ###
#          #              ####  #########     #     ###
#   %      ###########    ####  ###############     ###
## ###$$$$$###########                                $
## ###################% %#####  #*************        $
## ##########             ####  #############*      ###
## ########## ########   %#     #############*      ###
#         #   ########    #     #############*      ###
#           ##########    #  ################*      ###
## ###################    #  ##########*******      ###
## ###################    #  ##########*  $$        ###
#    #             ###    #  ##########*            ###
#    #             ###    #  #############% %###    ###
#    #             ###                  *     *#    ###
#                  ###    ###########   *     *#    ###
#                  ###    ###########   **% %**########
#                                             #########
#                                             #########
#######################################################
                                    `)

            const player = {
                x: 20,
                y: 2,

                rot: 0,

                vx: 0,
                vy: 0,

                max_speed: 25,
                accel: 10,
                friction: 5,
                stop_speed: 8,

                radius: 3,

                wish_forward: 0,
                wish_strafe: 0,
            }

            /**
             * @param {float} delta 
             */
            const move = (delta) => {
                /**
                 *     -strafe
                 *       |
                 *     --@----- > +forward
                 *       |
                 *       v
                 *     +strafe
                 */

                const speed = Math.hypot(player.vx, player.vy);

                // Friction
                if (speed > 0) {
                    // stop speed (stop scaling friction if lower than stop_speed - keeping friction high)
                    const control = speed < player.stop_speed ? player.stop_speed : speed;

                    const drop = control * player.friction * delta;

                    const new_speed = Math.max(speed - drop, 0);
                    const scale = new_speed / speed;

                    player.vx *= scale;
                    player.vy *= scale;
                }

                const f = player.wish_forward;
                const s = player.wish_strafe;

                const wish_len = Math.hypot(f, s);
                if (wish_len == 0) {
                    player.x += player.vx * delta;
                    player.y += player.vy * delta;
                    return;
                }

                const lf = f / wish_len;
                const ls = s / wish_len;

                const cos = Math.cos(player.rot);
                const sin = Math.sin(player.rot);

                const wish_x = lf * cos + ls * sin;
                const wish_y = lf * sin - ls * cos;

                let wish_speed = player.max_speed;
                if (wish_speed > player.max_speed) {
                    wish_speed = player.max_speed;
                }

                // Accel
                const current_speed_in_wish_dir = player.vx * wish_x + player.vy * wish_y;
                const add_speed = wish_speed - current_speed_in_wish_dir;

                if (add_speed > 0) {
                    const accel = player.accel * delta * wish_speed;
                    const applied = Math.min(accel, add_speed);

                    player.vx += wish_x * applied;
                    player.vy += wish_y * applied;
                }

                // Apply velocity
                player.x += player.vx * delta;
                player.y += player.vy * delta;
            }

            const calc_diag_pen_vec = (circle_x, circle_y, circle_r, vertex_x, vertex_y) => {
                const dx = circle_x - vertex_x;
                const dy = circle_y - vertex_y;

                const dist = Math.sqrt(dx * dx + dy * dy);

                const nx = dx / dist;
                const ny = dy / dist;

                const pen_diag_x = (circle_r - dist) * nx
                const pen_diag_y = (circle_r - dist) * ny
                return [pen_diag_x, pen_diag_y]
            }

            const calc_penetration_vector = (tilemap, player) => {
                const scale = tilemap.grid_scale;
                const w = tilemap.w;
                const h = tilemap.h;

                // Current Tile
                const tx = Math.floor(player.x / scale);
                const ty = Math.floor(player.y / scale);

                // Position within cell
                const rel_x = player.x % scale;
                const rel_y = player.y % scale;

                // Collider Radius
                const r = player.radius;

                // Collision mask
                let flag = 0b00000000;
                flag += 0b10000000 * (tilemap.buffer[bi_s(tx - 1, ty + 1, w, h)] != ' ')
                flag += 0b01000000 * (tilemap.buffer[bi_s(tx/**/, ty + 1, w, h)] != ' ')
                flag += 0b00100000 * (tilemap.buffer[bi_s(tx + 1, ty + 1, w, h)] != ' ')
                flag += 0b00010000 * (tilemap.buffer[bi_s(tx + 1, ty/**/, w, h)] != ' ')
                flag += 0b00001000 * (tilemap.buffer[bi_s(tx + 1, ty - 1, w, h)] != ' ')
                flag += 0b00000100 * (tilemap.buffer[bi_s(tx/**/, ty - 1, w, h)] != ' ')
                flag += 0b00000010 * (tilemap.buffer[bi_s(tx - 1, ty - 1, w, h)] != ' ')
                flag += 0b00000001 * (tilemap.buffer[bi_s(tx - 1, ty/**/, w, h)] != ' ')
                // console.log((flag >>> 0).toString(2))

                // Penetration Vector 
                let pen_x = 0;
                let pen_y = 0;

                // (flag & mask) == compare
                if ((flag & 0b11000001) == 0b10000000) {
                    if (dist_sq(rel_x, rel_y, 0, scale) < r * r) { // top left
                        [pen_x, pen_y] = calc_diag_pen_vec(rel_x, rel_y, r, 0, scale)
                    }
                }
                if ((flag & 0b01110000) == 0b00100000) {
                    if (dist_sq(rel_x, rel_y, scale, scale) < r * r) { // top right
                        [pen_x, pen_y] = calc_diag_pen_vec(rel_x, rel_y, r, scale, scale)
                    }
                }
                if ((flag & 0b00011100) == 0b00001000) {
                    if (dist_sq(rel_x, rel_y, scale, 0) < r * r) { // bottom right
                        [pen_x, pen_y] = calc_diag_pen_vec(rel_x, rel_y, r, scale, 0)
                    }
                }
                if ((flag & 0b00000111) == 0b00000010) {
                    if (dist_sq(rel_x, rel_y, 0, 0) < r * r) { // bottom left
                        [pen_x, pen_y] = calc_diag_pen_vec(rel_x, rel_y, r, 0, 0)
                    }
                }

                const scale_sub_r = scale - r; // cache for below
                // overwrite if needed (will always be an equal or "stronger" repulsion)
                if (flag & 0b01000000) {
                    if (rel_y > scale_sub_r) pen_y = scale_sub_r - rel_y; // Up
                }
                if (flag & 0b00010000) {
                    if (rel_x > scale_sub_r) pen_x = scale_sub_r - rel_x; // Right
                }
                if (flag & 0b00000100) {
                    if (rel_y < r) pen_y = r - rel_y; // Down
                }
                if (flag & 0b00000001) {
                    if (rel_x < r) pen_x = r - rel_x; // Left
                }

                return [pen_x, pen_y]
            }

            /**
             * @param {float} delta 
             */
            const collide = (delta) => {
                const [pen_x, pen_y] = calc_penetration_vector(tilemap, player);
                player.x += pen_x;
                player.y += pen_y;
            }

            /**
             * DDA (https://en.wikipedia.org/wiki/Digital_differential_analyzer_(graphics_algorithm))
             *
             * @param {int} x0
             * @param {int} y0
             * @param {int} x1
             * @param {int} y1
             *
             * @param {byte} r
             * @param {byte} g
             * @param {byte} b
             * @param {byte} a
             *
             * @return {void}
             */
            const draw_line = (x0, y0, x1, y1, r, g, b, a = 255) => {
                // find m = dy/dx
                const dx = x1 - x0;
                const dy = y1 - y0;

                // use the more "aggressive" axis (longer) as the step
                const longest_axis_mangnitude = (Math.abs(dx) >= Math.abs(dy)) ? Math.abs(dx) : Math.abs(dy)
                // the move along "step axis" by 1 pixel while moving along the other axis by the slope
                const step_x = dx / longest_axis_mangnitude;
                const step_y = dy / longest_axis_mangnitude;
                let x = x0;
                let y = y0;

                // since we only move 1 pixel in the longest magnitude axis(see above), we can iterate on it per pixel
                for (
                    let i = 0; i <= longest_axis_mangnitude; ++i) {
                    // paint along the steps
                    viewport.set_pixel(Math.round(x), Math.round(y), // ensure that it is the pixel position not a float
                        r, g, b, a
                    );

                    // move to next step
                    x += step_x;
                    y += step_y;
                }
            }

            /**
             * @param {int} x0
             * @param {int} y0
             * @param {int} x1
             * @param {int} y1
             *
             * @param {byte} r
             * @param {byte} g
             * @param {byte} b
             * @param {byte} a
             *
             * @return {void}
             */
            const draw_rect = (x0, y0, x1, y1, r, g, b, a = 255) => {
                for (let py = y0; py < y1; ++py) {
                    for (let px = x0; px < x1; ++px) {
                        viewport.set_pixel(px, py, r, g, b, a)
                    }
                }
            }

            /**
             * @param {int} x0
             * @param {int} y0
             * @param {int} x1
             * @param {int} y1
             *
             * @param {byte} r
             * @param {byte} g
             * @param {byte} b
             * @param {byte} a
             *
             * @return {void}
             */
            const draw_rect_hollow = (x0, y0, x1, y1, r, g, b, a = 255) => {
                // Left + Right edge
                for (let py = y0; py < y1; ++py) {
                    viewport.set_pixel(x0, py, r, g, b, a)
                    viewport.set_pixel(x1, py, r, g, b, a)
                }

                // Top + Bottom edge
                for (let px = x0; px < x1; ++px) {
                    viewport.set_pixel(px, y0, r, g, b, a)
                    viewport.set_pixel(px, y1, r, g, b, a)
                }
            }

            /**
             * @param {int} x0
             * @param {int} y0
             * @param {int} x1
             * @param {int} y1
             */
            const dist_sq = (x0, y0, x1, y1) => ((x0 - x1) * (x0 - x1)) + ((y0 - y1) * (y0 - y1))
            /**
             * @param {int} cx
             * @param {int} cy
             * @param {int} cr
             *
             * @param {byte} r
             * @param {byte} g
             * @param {byte} b
             * @param {byte} a
             *
             * @return {void}
             */
            const draw_circle = (cx, cy, cr, r, g, b, a = 255) => {
                const cr_sq = cr * cr;

                // within an AABB do a brute force circle check
                for (let py = cy - cr; py < cy + cr; ++py) {
                    for (let px = cx - cr; px < cx + cr; ++px) {
                        if (dist_sq(px, py, cx, cy) - cr_sq < 0) {
                            viewport.set_pixel(px, py, r, g, b, a)
                        }
                    }
                }
            }

            /**
             * @param {float} delta
             * @param {Viewport} viewport
             * @param {int} width
             * @param {int} height
             * @param {int} padding
             * @param {float} zoom
             * @param {float} circle_size
             */
            const draw_minimap = (delta, viewport, width, height, padding, zoom, circle_size) => {
                // assume it is always aligned to the bottom right (can make this a proper thing later)
                const x1 = viewport.get_viewport_w() - padding
                const x0 = x1 - width;
                const y0 = padding;
                const y1 = y0 + height;

                draw_rect(x0, y0, x1, y1, 10, 10, 10, 255) // BG

                // foreach pixel within the "frame"
                for (let fpy = 0; fpy < height; ++fpy) {
                    for (let fpx = 0; fpx < width; ++fpx) {
                        // frame pixel -> centered on zero
                        const px = Math.floor(fpx - width / 2);
                        const py = Math.floor(fpy - height / 2);

                        // Map pixel to world pos (and offset to center on player)
                        const x = player.x + (px / zoom); // zoom can also be thought of as making the tiles bigger relatively speaking
                        const y = player.y + (py / zoom);

                        // world pos -> tile pos -> tile index (floor)
                        const ix = Math.floor(x / tilemap.grid_scale);
                        const iy = Math.floor(y / tilemap.grid_scale);

                        // lookup correct tile and render
                        const bi = bi_s(ix, iy, tilemap.w, tilemap.h);
                        if (bi == undefined) { continue };
                        if (tilemap.buffer[bi] === '#') {
                            viewport.set_pixel(x0 + fpx, y0 + fpy, 200, 200, 200);
                        }
                    }
                }

                draw_rect_hollow(x0, y0, x1, y1, 255, 255, 255) // Outline

                // draw player (always center)
                draw_circle(Math.floor(x0 + width / 2), Math.floor(y0 + height / 2), circle_size, 0, 255, 0)
                viewport.set_pixel(Math.floor(x0 + width / 2), Math.floor(y0 + height / 2), 0, 255, 0);
            }

            /**
             * @param{Tilemap} tilemap
             * @param{int} ox       
             * @param{int} oy      
             * @param{int} dx
             * @param{int} dy
             * @param{float} max_dist
             */
            const raycast_dda = (tilemap, ox, oy, dx, dy, max_dist) => {
                // Scale positions to tilemap coords
                ox /= tilemap.grid_scale;
                oy /= tilemap.grid_scale;
                dx /= tilemap.grid_scale;
                dy /= tilemap.grid_scale;
                max_dist /= tilemap.grid_scale;

                // Cell positions are always ints
                let cx = Math.floor(ox);
                let cy = Math.floor(oy);

                // Diagonal distance from the edges of x to x+1 (or y to y+1)
                const diag_dist_x = Math.abs(1 / dx);
                const diag_dist_y = Math.abs(1 / dy);

                // Distance to nearest edge along said axis / distance travelled along the axis
                let edge_dist_x;
                let edge_dist_y;

                // Direction to step in per axis
                let step_x;
                let step_y;

                // Calculate initial step (to a cell edge)
                if (dx < 0) {
                    step_x = -1;
                    edge_dist_x = (ox - cx) * diag_dist_x;
                } else {
                    step_x = 1;
                    edge_dist_x = (cx + 1.0 - ox) * diag_dist_x;
                }

                if (dy < 0) {
                    step_y = -1;
                    edge_dist_y = (oy - cy) * diag_dist_y;
                } else {
                    step_y = 1;
                    edge_dist_y = (cy + 1.0 - oy) * diag_dist_y;
                }

                let side = 0;
                let perp_dist = 0;

                // DDA loop
                while (perp_dist <= max_dist) {
                    // Choose the axis to "snap" to which requires moving along the diagonal the least
                    if (edge_dist_x < edge_dist_y) {
                        perp_dist = edge_dist_x;
                        edge_dist_x += diag_dist_x;
                        cx += step_x;
                        side = 0;
                    } else {
                        perp_dist = edge_dist_y;
                        edge_dist_y += diag_dist_y;
                        cy += step_y;
                        side = 1;
                    }

                    const bi = bi_s(cx, cy, tilemap.w, tilemap.h);
                    if (bi == undefined) {
                        return null;
                    }

                    const cell = tilemap.buffer[bi];
                    if (cell != ' ') {
                        // The horizontal position along a texture (x but for a texture)
                        let tex_u;
                        // Find the position that the ray collided
                        const hit_x = ox + perp_dist * dx;
                        const hit_y = oy + perp_dist * dy;

                        if (side == 0) {
                            // Hit a wall aligned with y-axis
                            // So u should be based on the y position
                            tex_u = hit_y - Math.floor(hit_y);
                            // Reverse position when hitting from opposite direction (un-flip so the texture faces the right way)
                            if (dx < 0) tex_u = 1.0 - tex_u;
                        } else {
                            // Hit a wall aligned with x-axis
                            tex_u = hit_x - Math.floor(hit_x);
                            if (dy > 0) tex_u = 1.0 - tex_u;
                        }

                        return {
                            side: side,
                            cell: cell,
                            cell_pos_x: cx,
                            cell_pos_y: cy,
                            perp_dist: perp_dist,
                            tex_u: tex_u
                        };
                    }
                }
                return null;
            };



            /**

             * @returns {Promise<Texture>}
             */
            const b64_to_img = async (b64) => {
                if (!b64.startsWith("data:")) {
                    b64 = "data:image/png;base64," + b64;
                }

                const img = new Image();
                img.src = b64;

                await img.decode();

                const canvas = document.createElement("canvas");
                canvas.width = img.width;
                canvas.height = img.height;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0);

                const { data } = ctx.getImageData(0, 0, img.width, img.height);
                return { buffer: data, w: img.width, h: img.height };
            }

MStOdTaQ2PLgJ3E7RYBnNXzlhMmGr2B7n2iG9NCDbEI5TiD23/UBiSIUJwgstshBAEehJAYS7HQC9iaACsKADkAwq1CEWJ1OIewUWfGKKM5/SYAhwEkLJLYLwf6GRa0we6IOVgCqx0khgpHLyyAY+3bQKDAFwxRBghmOAU/keIVzRmz+TSISIqh7xgNxCbKToqziPYaZCoysgGGwTOEYiVMUCVMvuwmwmS/H1NmAkNhBIKqt9nR3erY46HADiWOoWwyd5xosyRZLchC7Y2yUbbgVJbl1mD3qCFrxxDH21CPO5orTbdlR3PS3bFG30m0SSQXYrLMPm5/QKoI5tezK5H8Du2J4qDdhDe4AAAAASUVORK5CYII=");

            const TEX_LOOKUP = {
                '#': TEX_WALL_SAND,
                '*': TEX_WALL_STONE,
                '%': TEX_WALL_WOOD,
                '$': TEX_WALL_BATH
            }
            /**
             * @param {float} delta
             * @param {Viewport} viewport
             * @param {float} max_render_dist
             */
            const render_scene = (delta, viewport, max_render_dist) => {
                const w = viewport.get_viewport_w();
                const h = viewport.get_viewport_h();
                const aspect_ratio = w / h;

                // Camera / player look direction  
                const look_dir_x = Math.cos(player.rot);
                const look_dir_y = Math.sin(player.rot);

                // The camera plane (a line in 2D) defined by a 2D vector
                //                      
                //                         plane width
                //                     +-----------------+ 
                //                     ___________________ 
                //                  +  \        |        /
                //                  |   \       |       /
                //                  |    \      |      /
                //                  |     \     |     /
                //   plane distance |      \    |    /
                //                  |       \   |   /
                //                  |        \  |  /   
                //                  |         \ | / \___ FoV   
                //                  |          \|/
                //                  +           v
                //                              @
                //                            
                //

                // Scaling the camera plane based on the fov (a ratio between the distance of the plane and the (half-)width)
                const base_fov_scale = Math.tan(fov / 2)

                // The camera plane (x+ is the "forward" of the camera at rotation = 0)
                //
                //     y+
                //     ^            
                //     |          /
                //     +--> x+   / 
                //              /  
                //             /   
                //            /    
                //           @----->  look dir            + 
                //            \                           | camera plane
                //             \                          |
                //              \                         v
                //               \ 
                //                \
                //                 
                // Convert the camera plane from local space to world space
                const cam_plane_x = -look_dir_y * base_fov_scale * aspect_ratio;
                const cam_plane_y = look_dir_x * base_fov_scale * aspect_ratio;

                // Cache the calculation of the wall height scaling
                const wall_scale_factor = (h * tilemap.grid_scale) / (2 * base_fov_scale);

                // Foreach vertical pixel
                for (let px = 0; px < w; ++px) {
                    // Map the pixel to the offset from the center of the plane
                    const offset_along_plane = 1 - (2 * px / w);
                    // Take the raycast direction
                    const dx = look_dir_x + cam_plane_x * offset_along_plane;
                    const dy = look_dir_y + cam_plane_y * offset_along_plane;

                    const hit = raycast_dda(tilemap, player.x, player.y, dx, dy, max_render_dist);
                    if (hit != null) {
                        const tex = TEX_LOOKUP[hit.cell]

                        // Calc the x/u position first since we already know all that we need for a vertical  
                        // X position of the pixel that maps to the ray hit within the texture
                        let u = Math.floor(hit.tex_u * tex.w);
                        // Clamp within texture bounds
                        u = Math.max(0, Math.min(u, tex.w - 1));

                        // Height of the hit wall
                        const line_height = Math.floor(wall_scale_factor / hit.perp_dist);

                        let py_wall_bottom = (h - line_height) / 2;
                        let py_wall_top = (h + line_height) / 2;

                        const shade =
                            (1 - Math.sqrt(hit.perp_dist / max_render_dist)) // Shade based on distance
                            * (hit.side === 1 ? 0.6 : 1); // Shade based on side

                        // Draw vertical
                        for (let py = 0; py < h; ++py) {
                            if (py < py_wall_bottom) {
                                // Floor
                                viewport.set_pixel(px, py, 94, 76, 74);
                            } else if (py_wall_top < py) {
                                // Celing / Sky
                                viewport.set_pixel(px, py, 139, 186, 216);
                            } else {
                                // TODO: this maths could be optimised later
                                let ty = Math.floor((py - py_wall_bottom) / (py_wall_top - py_wall_bottom) * tex.h);
                                // Clamp within texture bounds
                                ty = Math.max(0, Math.min(ty, tex.h - 1));

                                // Convert to position in texture buffer
                                const uv_idx = (ty * tex.w + u) * 4;
                                // Extract as colour 
                                const r = tex.buffer[uv_idx];
                                const g = tex.buffer[uv_idx + 1];
                                const b = tex.buffer[uv_idx + 2];

                                // Draw with shading
                                viewport.set_pixel(px, py, r * shade, g * shade, b * shade);
                            }
                        }
                    } else {
                        // ERROR - failed to hit tile
                        for (let py = 0; py < h; ++py) {
                            viewport.set_pixel(px, py, 255, 0, 255);
                        }
                    }
                }
            };

            /// MARK: DRAW TICK
            /**
             * @param {float} delta
             * @param {Viewport} viewport
             */
            const draw = (delta, viewport) => {
                render_scene(delta, viewport, 150000)

                const ui_scale = viewport.get_viewport_h() / 720;
                draw_minimap(delta, viewport, Math.floor(300 * ui_scale), Math.floor(250 * ui_scale), 5, 2 * ui_scale, Math.floor(5 * ui_scale));
            };

            const tick_rate = null; // TODO: remove input from being read on this tick rate
            const render_fps = null;

            let physics_last_frame = performance.now();
            let render_last_frame = performance.now();
            let physics_delta = 0;
            let render_delta = 0;

            let sens = 0.001;
            let virtual_sens_multiplier = 2000;
            const input = {
                kbm: {
                    keys: {},
                    mouse: {
                        dx: 0, dy: 0,
                        buttons: {}
                    },
                },
                virtual: {
                    dpad_forward: false,
                    dpad_backward: false,
                    dpad_left: false,
                    dpad_right: false,

                    look_left: false,
                    look_right: false
                }
            };

            const process_input = (delta) => {
                //strafe
                player.wish_strafe = 0
                if (input.kbm.keys.a || input.virtual.dpad_left) { player.wish_strafe += -1; }
                if (input.kbm.keys.d || input.virtual.dpad_right) { player.wish_strafe += 1; }
                //forward
                player.wish_forward = 0
                if (input.kbm.keys.s || input.virtual.dpad_backward) { player.wish_forward += -1; }
                if (input.kbm.keys.w || input.virtual.dpad_forward) { player.wish_forward += 1; }
                //look
                if (input.kbm.mouse.dx) {
                    player.rot += sens * -input.kbm.mouse.dx; // -ve = non-inverted mouse
                    input.kbm.mouse.dx = 0; // consume the delta after reading otherwise it will continue with no input
                }
                else {
                    if (input.virtual.look_left) {
                        player.rot += sens * virtual_sens_multiplier * delta;
                    }
                    if (input.virtual.look_right) {
                        player.rot -= sens * virtual_sens_multiplier * delta;
                    }
                }
            }

            /// MARK: PHYSICS TICK
            const tick = (delta) => {
                process_input(delta);

                move(delta)
                collide(delta)
            }

            const viewport = setup_viewport();
            viewport.set_resolution(_DEFAULT_VIEWPORT_W, _DEFAULT_VIEWPORT_H);

            // Keyboard
            ["keydown", "keyup"].forEach(type => {
                window.addEventListener(type, e => {
                    input.kbm.keys[e.key] = type === "keydown";
                });
            });

            // Mouse
            ["mousedown", "mouseup"].forEach(type => {
                window.addEventListener(type, e => {
                    input.kbm.mouse.buttons[e.button] = type === "mousedown";
                });
            });

            const canvas = document.getElementById("viewport").addEventListener("mousemove", e => {
                input.kbm.mouse.dx += e.movementX;
                input.kbm.mouse.dy += e.movementY;
            });

            // Virtual Controls
            const bind_virtual_button = (button, bind) => {
                // Button
                button.addEventListener("touchstart", e => {
                    e.preventDefault();

                    input.virtual[bind] = true;
                }, { passive: false })
                button.addEventListener("touchend", e => {
                    e.preventDefault();

                    input.virtual[bind] = false;
                }, { passive: false })

                // Mouse
                button.addEventListener("mousedown", e => {
                    input.virtual[bind] = true;
                    e.preventDefault();
                }, { passive: false });

                button.addEventListener("mouseup", e => {
                    input.virtual[bind] = false;
                });

                button.addEventListener("mouseleave", () => {
                    input.virtual[bind] = false;
                });
            }
            const button_move_forward = document.getElementById("virtual-dpad-forward"); bind_virtual_button(button_move_forward, "dpad_forward")
            const button_move_backward = document.getElementById("virtual-dpad-backward"); bind_virtual_button(button_move_backward, "dpad_backward")
            const button_move_left = document.getElementById("virtual-dpad-left"); bind_virtual_button(button_move_left, "dpad_left")
            const button_move_right = document.getElementById("virtual-dpad-right"); bind_virtual_button(button_move_right, "dpad_right")

            const button_look_left = document.getElementById("virtual-look-left"); bind_virtual_button(button_look_left, "look_left")
            const button_look_right = document.getElementById("virtual-look-right"); bind_virtual_button(button_look_right, "look_right")

            /// MARK: UPDATE
            const update = () => {
                const current_frame = performance.now();

                physics_delta = (current_frame - physics_last_frame) / 1000;
                if (tick_rate == null || physics_delta >= 1 / tick_rate) {
                    tick(physics_delta);
                    physics_last_frame = current_frame;
                }

                render_delta = (current_frame - render_last_frame) / 1000;
                if (render_fps == null || render_delta >= 1 / render_fps) {
                    viewport.clear();
                    draw(render_delta, viewport);
                    viewport.render();
                    render_last_frame = current_frame;
                }

                requestAnimationFrame(() => update());
            };
            player.x = 200;
            player.y = 20 ;

            requestAnimationFrame(() => update());
        })();
    </script>
