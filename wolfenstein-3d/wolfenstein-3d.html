<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wolfenstein 3D</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        #viewport {
            width: 1280px;
            /* display size */
            height: 720px;
            image-rendering: pixelated;
        }
    </style>
</head>

<body>
    <h1>Wolfenstein 3D</h1>
    <div> <canvas id="viewport"></canvas></div>
    <div> <canvas id="render_cam_example"> </canvas></div>
    <script>
        "use strict";
        const buffer_index = (x, y, w) => y * w + x;
        const buffer_index_safe = (x, y, w, h) => {
            if (x >= w || y >= h) {
                console.error("Out of bounds.")
                return undefined
            }
            return buffer_index(x, y, w)
        }
        const create_rect_buffer = (w, h) => new Array(w * h);

        const _DEFAULT_VIEWPORT_W = 400;
        const _DEFAULT_VIEWPORT_H = 300;
        const setup_viewport = () => {
            const canvas = document.getElementById("viewport");
            const ctx = canvas.getContext("2d");

            let viewport_w = _DEFAULT_VIEWPORT_W;
            const get_viewport_w = () => viewport_w;
            let viewport_h = _DEFAULT_VIEWPORT_H;
            const get_viewport_h = () => viewport_h;

            let imageData;
            let framebuffer;
            /**
             * @param {number} w
             * @param {number} h
             * @return {void}
             */
            const set_resolution = (w, h) => {
                viewport_w = w;
                viewport_h = h;

                canvas.width = viewport_w;
                canvas.height = viewport_h;

                imageData = ctx.createImageData(viewport_w, viewport_h);
                framebuffer = imageData.data;
            };

            /**
             * @param {number} x
             * @param {number} y
             * @param {number} r
             * @param {number} g
             * @param {number} b
             * @param {number} [a=255]
             * @return {void}
            */
            const set_pixel = (x, y, r, g, b, a = 255) => {
                const i = (((viewport_h - 1) - y) * viewport_w + x) * 4;
                framebuffer[i] = r;
                framebuffer[i + 1] = g;
                framebuffer[i + 2] = b;
                framebuffer[i + 3] = a;
            };
            /**
             * @return {void}
             */
            const clear = () => framebuffer.fill(0);

            /**
             * @return {void}
             */
            const render = () => ctx.putImageData(imageData, 0, 0);

            return {
                get_viewport_w,
                get_viewport_h,
                set_resolution,

                set_pixel,
                clear,
                render,
            };
        }

        /**
         * @param {string} str
         */
        const load_tilemap = (str) => {

            const rows = str.split("\n").map(row => row.trim()).filter(row => row.length > 0);

            const w = rows[0].length;
            const h = rows.length;

            const tilemap = create_rect_buffer(w, h);
            let i = 0;

            for (let y = 0; y < h; ++y) {
                const ty = h - 1 - y;
                if (w != rows[ty].length) {
                    console.error("Tilemap is of irregular size, must be a rectangle.")
                    return null;
                }

                for (let x = 0; x < w; ++x) {
                    const tx = x;
                    tilemap[i] = rows[ty][tx]
                    ++i;
                }
            }

            if (i != w * h) {
                console.error("Tilemap is of irregular size.")
                return null
            }
            return {
                buffer: tilemap,
                w: w,
                h: h
            }
        }

        const tilemap = load_tilemap(`
###########
#   #     #
#   #  #  #
## ##     #
#         #
#     #####
#         #
# #       #
# ###     #
#      S  #
###########
`)

        const draw = (delta, viewport) => {
            for (let y = 0; y < viewport.get_viewport_h(); ++y) {
                for (let x = 0; x < viewport.get_viewport_w(); ++x) {
                    if (x >= tilemap.w || y >= tilemap.h) {
                        continue;
                    }
                    const bi = buffer_index_safe(x, y, tilemap.w, tilemap.h);
                    const foo = tilemap.buffer[bi];

                    if (foo === '#') {
                        viewport.set_pixel(x, y, 255, 0, 255);
                    }
                }
            }
        };

        const tick_rate = 60;
        const render_fps = null;

        let physics_last_frame = performance.now();
        let render_last_frame = performance.now();
        let physics_delta = 0;
        let render_delta = 0;

        const tick = (delta) => {

        }

        const viewport = setup_viewport();
        viewport.set_resolution(128, 72);

        const update = () => {
            const current_frame = performance.now();

            physics_delta = (current_frame - physics_last_frame) / 1000;
            if (tick_rate == null || physics_delta >= 1 / tick_rate) {
                tick(physics_delta);
                physics_last_frame = current_frame;
            }

            render_delta = (current_frame - render_last_frame) / 1000;
            if (render_fps == null || render_delta >= 1 / render_fps) {
                draw(render_delta, viewport);
                viewport.render();
                render_last_frame = current_frame;
            }

            requestAnimationFrame(() => update());
        };

        requestAnimationFrame(() => update());
    </script>

    <script>
        const D2R = Math.PI / 180;

        const SCREEN_W = 500;
        const SCREEN_H = 500;

        let res = 100;
        let fov = 90;

        const canvas = document.getElementById("render_cam_example");
        canvas.width = SCREEN_W;
        canvas.height = SCREEN_H;
        const ctx = canvas.getContext("2d");
        const draw_line = (x0, y0, x1, y1) => {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();
        }
        const draw_ray = (x, y, offset_x, offset_y) => {
            draw_line(x, y, x + offset_x, y + offset_y)
        }
        const draw_box = (x0, y0, x1, y1) => {
            ctx.beginPath();
            ctx.rect(x0, y0, x1 - x0, y1 - y0);
            ctx.stroke();
        };

        /**
         * See: https://www.scratchapixel.com/lessons/3d-basic-rendering/minimal-ray-tracer-rendering-simple-shapes/ray-box-intersection.html
         * @return{boolean}
         */
        const raycast_aabb = (start_x, start_y, direction_x, direction_y, x0, y0, x1, y1) => {
            const t1 = (x0 - start_x) / direction_x;
            const t2 = (x1 - start_x) / direction_x;
            const t3 = (y0 - start_y) / direction_y;
            const t4 = (y1 - start_y) / direction_y;

            const tmin = Math.max(Math.min(t1, t2), Math.min(t3, t4));
            const tmax = Math.min(Math.max(t1, t2), Math.max(t3, t4));

            if (tmax < 0) return null;      // box is behind ray
            if (tmin > tmax) return null;   // no intersection

            return tmin >= 0 ? tmin : tmax; // nearest positive hit
        }


        const raycast_boxes = (rx, ry, dx, dy, boxes) => {
            let bestT = Infinity;
            let hit = null;

            for (const box of boxes) {
                const t = raycast_aabb(rx, ry, dx, dy, box);
                if (t != null && t < bestT) {
                    bestT = t;
                    hit = box;
                }
            }

            if (!hit) return null;

            return {
                t: bestT,
                x: rx + dx * bestT,
                y: ry + dy * bestT,
                box: hit
            };
        }

        const camera_pos_x = 0
        const camera_pos_y = 0

        const boxes = [
            {
                x0: 50,
                y0: 50,
                x1: 100,
                y1: 100,
            },
            {
                x0: 320,
                y0: 20,
                x1: 240,
                y1: 40,
            }
        ]
        ctx.strokeStyle = "white";

        boxes.forEach(box => {
            draw_box(box.x0, box.y0, box.x1, box.y1)
        });


        const ray_degs = new Array(res);
        for (let p = 0; p < res; p++) {
            let deg = p * (fov / (res - 1)) - fov / 2;
            ray_degs[p] = deg

            const ray_len = 1000;
            draw_ray(
                200, 200,
                ray_len * Math.cos((deg - 90) * D2R), ray_len * Math.sin((deg - 90) * D2R)
            )
        }

    </script>
</body>

</html>
